# Scalable pool of additional victim machines (fleet) for Zabbix monitoring.
# Each replica is the same image as victim (nginx HTTP/2 + zabbix-agent2), but:
#   - without a fixed container name -> the service is scalable (--scale),
#   - with a dynamic hostname (HostnameItem=system.hostname) -> unique per replica,
#   - with HostMetadata=ddos-lab-pool -> the server auto-registers the host (autoregistration).
#
# Requires the monitoring layer (docker-compose.monitoring.yml), because it uses
# the lab-victim-zabbix image and the labnet network and zabbix-server.
#
# Enable 5 machines:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.override.yml \
#     -f docker-compose.monitoring.yml \
#     -f docker-compose.victims.yml \
#     up -d --build victim-node
#
# Different number of machines (e.g. 10):  add  --scale victim-node=10
# First, one-time enable the autoregistration rule (see README-MONITORING.md):
#   docker compose ... run --rm zabbix-autoreg

services:
  victim-node:
    build: ./victim
    image: lab-victim-zabbix:latest
    # NO container_name -> service is scalable.
    restart: unless-stopped
    environment:
      # Readable, unique hostname: victim-<container id>, e.g. victim-ab12cd34.
      ZBX_HOSTNAME_PREFIX: "victim"
      # Tag for the autoregistration rule on the server.
      ZBX_METADATA: "ddos-lab-pool"
    networks:
      - labnet
    deploy:
      # Default 5 machines; override with  --scale victim-node=N
      replicas: 5

  # One-time setup: creates an autoregistration rule that automatically
  # registers each machine with HostMetadata "ddos-lab-pool",
  # adds it to the "DDoS Lab Pool" group and links the Linux template.
  zabbix-autoreg:
    image: python:3.12-alpine
    container_name: lab-zabbix-autoreg
    profiles:
      - provision
    depends_on:
      - zabbix-web
    environment:
      ZBX_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZBX_USER: Admin
      ZBX_PASS: zabbix
    volumes:
      - ./monitoring:/scripts:ro
    command: ["python", "/scripts/autoreg.py"]
    networks:
      - monnet
