# Monitoring layer: Zabbix server (7.0 LTS) + PostgreSQL database + web frontend.
# Optional overlay — the base lab (victim + loadgen [+ bot + c2]) works without it.
#
# Enable (together with the base override bot/c2):
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.override.yml \
#     -f docker-compose.monitoring.yml \
#     up -d --build
#
# Or via environment variable (to avoid typing -f each time):
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml:docker-compose.monitoring.yml
#
# Frontend: http://localhost:8080  (login: Admin / zabbix)
#
# Networks:
#   - labnet  (internal, from base)  -> server <-> agent(victim) <-> database, no internet
#   - monnet  (bridge)               -> only to expose frontend port 8080 to the host

services:
  # Replace victim with an image that includes zabbix-agent2 (see victim/Dockerfile).
  # The rest of the definition (volumes, labnet network, CPU/RAM limits) is inherited from
  # docker-compose.yml and docker-compose.override.yml via merge.
  victim:
    build: ./victim
    image: lab-victim-zabbix:latest

  zabbix-db:
    image: postgres:16-alpine
    container_name: lab-zabbix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pg_pw
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks:
      - labnet

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: lab-zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pg_pw
      POSTGRES_DB: zabbix
    volumes:
      # Alert scripts (script type media); lab_alert.sh logs alerts.
      - ./monitoring/alertscripts:/usr/lib/zabbix/alertscripts:ro
    depends_on:
      - zabbix-db
    networks:
      - labnet

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: lab-zabbix-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pg_pw
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Warsaw
    depends_on:
      - zabbix-db
      - zabbix-server
    ports:
      - "8080:8080"
    networks:
      - labnet
      - monnet

  # One-time provisioner: creates the "victim" host in Zabbix, connects it to
  # the agent and templates. Run on demand via "provision" profile (see README).
  zabbix-provision:
    image: python:3.12-alpine
    container_name: lab-zabbix-provision
    profiles:
      - provision
    depends_on:
      - zabbix-web
    environment:
      ZBX_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZBX_USER: Admin
      ZBX_PASS: zabbix
    volumes:
      - ./monitoring:/scripts:ro
    command: ["python", "/scripts/provision.py"]
    networks:
      - monnet

  # One-time detection setup: triggers (CPU / requests / Rapid Reset) + alerting.
  zabbix-alerts:
    image: python:3.12-alpine
    container_name: lab-zabbix-alerts
    profiles:
      - provision
    depends_on:
      - zabbix-web
    environment:
      ZBX_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZBX_USER: Admin
      ZBX_PASS: zabbix
    volumes:
      - ./monitoring:/scripts:ro
    command: ["python", "/scripts/alerts.py"]
    networks:
      - monnet

networks:
  monnet:
    driver: bridge

volumes:
  zabbix-db-data:
