# Warstwa monitoringu: serwer Zabbix (7.0 LTS) + baza PostgreSQL + frontend WWW.
# Opcjonalny overlay — bazowy lab (victim + loadgen [+ bot + c2]) dziala bez niego.
#
# Wlaczenie (razem z bazowym override bot/c2):
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.override.yml \
#     -f docker-compose.monitoring.yml \
#     up -d --build
#
# Albo przez zmienna srodowiskowa (zeby nie wpisywac -f za kazdym razem):
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml:docker-compose.monitoring.yml
#
# Frontend: http://localhost:8080  (login: Admin / zabbix)
#
# Siec:
#   - labnet  (internal, z bazy)  -> serwer <-> agent(victim) <-> baza, bez internetu
#   - monnet  (bridge)            -> tylko po to, by wystawic port 8080 frontendu na host

services:
  # Podmiana victima na obraz z wbudowanym zabbix-agent2 (patrz victim/Dockerfile).
  # Reszta definicji (volumes, siec labnet, limity CPU/RAM) dziedziczy sie z
  # docker-compose.yml i docker-compose.override.yml przez merge.
  victim:
    build: ./victim
    image: lab-victim-zabbix:latest

  zabbix-db:
    image: postgres:16-alpine
    container_name: lab-zabbix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pg_pw
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks:
      - labnet

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: lab-zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pg_pw
      POSTGRES_DB: zabbix
    volumes:
      # Skrypty alertow (media type typu "script"); lab_alert.sh loguje alerty.
      - ./monitoring/alertscripts:/usr/lib/zabbix/alertscripts:ro
    depends_on:
      - zabbix-db
    networks:
      - labnet

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: lab-zabbix-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pg_pw
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Warsaw
    depends_on:
      - zabbix-db
      - zabbix-server
    ports:
      - "8080:8080"
    networks:
      - labnet
      - monnet

  # Jednorazowy provisioner: tworzy w Zabbixie hosta "victim", podpina go pod
  # agenta i szablony. Uruchamiany na zadanie profilem "provision" (patrz README).
  zabbix-provision:
    image: python:3.12-alpine
    container_name: lab-zabbix-provision
    profiles:
      - provision
    depends_on:
      - zabbix-web
    environment:
      ZBX_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZBX_USER: Admin
      ZBX_PASS: zabbix
    volumes:
      - ./monitoring:/scripts:ro
    command: ["python", "/scripts/provision.py"]
    networks:
      - monnet

  # Jednorazowy setup detekcji: triggery (CPU / zadania / Rapid Reset) + alertowanie.
  zabbix-alerts:
    image: python:3.12-alpine
    container_name: lab-zabbix-alerts
    profiles:
      - provision
    depends_on:
      - zabbix-web
    environment:
      ZBX_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZBX_USER: Admin
      ZBX_PASS: zabbix
    volumes:
      - ./monitoring:/scripts:ro
    command: ["python", "/scripts/alerts.py"]
    networks:
      - monnet

networks:
  monnet:
    driver: bridge

volumes:
  zabbix-db-data:
