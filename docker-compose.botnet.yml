# Scalable bot fleet for multi-source load testing.
#
# SCOPE AND BOUNDARY (important):
#   This service manages ONLY containers of THIS lab, which already have the
#   `rapidreset` PoC baked in at `docker build` time (see bot/Dockerfile - the
#   binary is compiled and placed in the image ONCE, during build). The container
#   starts idle ("sleep infinity"); you launch the attack manually via
#   scenarios/botnet-fleet.sh.
#
#   There is NO mechanism here that would deploy the attack to devices that don't
#   already have it (implant, auto-distribution, C2 push). This is intentionally
#   out of scope - we only manage our own, pre-built fleet.
#
# Usage (see scenarios/botnet-fleet.sh for ready commands):
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.botnet.yml up -d --build --scale botfleet=5
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.botnet.yml ps -q botfleet       # list fleet container IDs

services:
  botfleet:
    build: ./bot          # SAME image/Dockerfile as the "bot" service (override.yml) -
                           # rapidreset built-in at build time, nothing at runtime.
    image: ddos-lab-botfleet:latest
    # NO container_name -> scalable via --scale botfleet=N
    # (same pattern as docker-compose.victims.yml / victim-node).
    networks:
      - labnet
    # Pinned to cores 2-11 (NOT 0,1 - those are reserved for the victim,
    # see docker-compose.labvic.yml). The fleet CANNOT steal CPU from the victim
    # regardless of the number of containers - physical isolation, not just limits.
    # Adjust to your host (`docker info --format '{{.NCPU}}'`).
    cpuset: "2-11"
    deploy:
      resources:
        limits:
          cpus: "${BOT_CPUS:-0.8}"
          memory: 256M
