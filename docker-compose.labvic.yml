# Connects an "old server" (nginx BEFORE the HTTP/2 Rapid Reset mitigation,
# CVE-2023-44487 - patch in 1.25.3) to the "victim" service managed by
# docker-compose, instead of manual `docker build`/`docker run` as in
# lab-results/scripts/run-botnet-matrix.sh.
#
# Uses the already existing victim/Dockerfile.labvic (ARG BASE = nginx
# version) + victim/entry.labvic.sh (variable MODE = normal|hardened, switches
# config at runtime). Nothing new is added - it just wires this into "victim".
#
# Thanks to this, the fleet (docker-compose.botnet.yml + scenarios/botnet-fleet.sh)
# automatically attacks THIS server without any extra steps: "victim"
# is always the same DNS alias on the labnet network, only the image underneath changes.
#
# --- Usage ---
#
# A) VULNERABLE, without hardening (to see real Rapid Reset):
#   NGINX_OLD=1.25.1-alpine VICTIM_MODE=normal \
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.labvic.yml -f docker-compose.botnet.yml \
#     up -d --build --scale botfleet=5
#
#   bash scenarios/botnet-fleet.sh fire --requests 20000 --concurrency 300
#
# B) VULNERABLE nginx version + ENABLED hardening (rate-limiting) - comparison:
#   NGINX_OLD=1.25.1-alpine VICTIM_MODE=hardened  (rest as above)
#
# C) Patched nginx for comparison: simply DON'T add this overlay
#    (keeps the default nginx:1.27-alpine from docker-compose.yml / monitoring.yml).
#
# Parameters (environment variables):
#   NGINX_OLD     base nginx image version (default 1.25.1-alpine,
#                 last before reset mitigation in 1.25.3)
#   VICTIM_MODE   normal | hardened (default normal)
#   VIC_CPUS      victim CPU limit (default 2) - NOTE: must match
#                 `worker_processes` in victim/nginx*.conf (hardcoded to 2 there),
#                 otherwise nginx again overestimates the number of workers relative
#                 to the actual cgroup budget.
#
# CORE ISOLATION (cpuset): victim gets cores 0,1 EXCLUSIVELY. The bot
# fleet (docker-compose.botnet.yml) is pinned to cores 2-11. This way
# many fleet containers CANNOT steal CPU from the victim regardless of their
# count - each side has a physically separated pool. Without this, docker-compose
# CPU limits are just an upper ceiling in a SHARED host core pool, which with a large
# fleet (e.g. 100 bots) caused skewed/noisy CPU% measurements of the victim.
# Adjust the core range to your host (check: `docker info --format
# '{{.NCPU}}'`); below assumes a 12-core host.

services:
  victim:
    build:
      context: ./victim
      dockerfile: Dockerfile.labvic
      args:
        BASE: "nginx:${NGINX_OLD:-1.25.1-alpine}"
    image: lab-victim-labvic:latest
    environment:
      MODE: "${VICTIM_MODE:-normal}"
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          cpus: "${VIC_CPUS:-2}"
          memory: 512M
    # NOTE: docker-compose.yml (base) bind-mounts ./victim/nginx.conf as
    # read-only to /etc/nginx/nginx.conf. Compose MERGES volume lists between
    # files (you can't "clear" them here with volumes: []), so this bind
    # mount stays active. This is OK: entry.labvic.sh writes config to a DIFFERENT
    # path (/etc/nginx/active.conf), and Dockerfile.labvic runs nginx with
    # `-c /etc/nginx/active.conf`, so the bind-mount on nginx.conf is simply
    # unused (no conflict). The cert.pem/key.pem/html bind-mounts from the base
    # overwrite identical content copied into the image - no functional difference.
