# Latency probe (vegeta) - measures response time of a legitimate client against
# the victim. Pinned to core 2 EXCLUSIVELY (victim: 0-1, fleet: 3-11),
# so its measurements are NOT skewed by its own CPU starvation - this is a
# prerequisite for reliable latency charts.
#
# Launched together with the rest of the stack via scenarios/control.sh ('up'), or:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.labvic.yml -f docker-compose.probe.yml up -d --build probe

services:
  probe:
    build: ./probe
    image: lab-probe:latest
    container_name: lab-probe
    cpuset: "2"
    environment:
      TARGET: "https://victim/"
      RATE: "${PROBE_RATE:-10}"
      WINDOW: "${PROBE_WINDOW:-2}"
      CSV: "/data/probe.csv"
    volumes:
      - ./lab-results/live:/data
    networks:
      - labnet
    restart: unless-stopped
