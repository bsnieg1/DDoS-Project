# Sonda latencji (vegeta) - mierzy czas odpowiedzi uczciwego klienta wobec
# victima. Przypieta do rdzenia 2 NA WYLACZNOSC (victim: 0-1, flota: 3-11),
# zeby jej pomiary NIE byly skazone wlasnym glodzeniem CPU - to warunek
# wiarygodnosci wykresu latencji.
#
# Uruchamiana razem z reszta stosu przez scenarios/control.sh ('up'), albo:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.labvic.yml -f docker-compose.probe.yml up -d --build probe

services:
  probe:
    build: ./probe
    image: lab-probe:latest
    container_name: lab-probe
    cpuset: "2"
    environment:
      TARGET: "https://victim/"
      RATE: "${PROBE_RATE:-10}"
      WINDOW: "${PROBE_WINDOW:-2}"
      CSV: "/data/probe.csv"
    volumes:
      - ./lab-results/live:/data
    networks:
      - labnet
    restart: unless-stopped
