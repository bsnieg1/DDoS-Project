worker_processes auto;
events { worker_connections 1024; }

# =====================================================================
#  UTWARDZONY wariant konfiguracji victima (hardening).
#  Mitygacja HTTP/2 Rapid Reset (CVE-2023-44487) metodami konfiguracyjnymi,
#  jako obrona w glab PONAD wbudowana latka nginx >= 1.25.3.
#  Uzywany przez docker-compose.hardening.yml (podmienia nginx.conf).
#  Porownaj zachowanie z wariantem podatnym (victim/nginx.conf) na wykresach
#  Zabbixa: pod atakiem rate-limit zwraca 429, a CPU/liczba przetworzonych
#  zadan pozostaja ograniczone.
# =====================================================================

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format labfmt '$remote_addr proto=$server_protocol status=$status '
                      'req="$request" conn_requests=$connection_requests';
    access_log /var/log/nginx/access.log labfmt;

    # --- Rate limiting: ogranicz tempo zadan i liczbe polaczen per IP ---
    # Flood strumieni HTTP/2 z jednego zrodla zostaje odciety tanim 429,
    # zamiast obciazac backend pelnym przetwarzaniem.
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conns:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 443 ssl;
        http2 on;
        server_name victim.lab;

        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;

        # --- Zaostrzone limity HTTP/2 (wzgledem wariantu podatnego) ---
        # Mniej rownoczesnych strumieni na polaczenie + krotsze polaczenia
        # (mniej zadan na polaczenie) ograniczaja mnoznik Rapid Reset.
        http2_max_concurrent_streams 32;   # podatny: 128
        keepalive_requests 100;            # podatny: 1000
        keepalive_timeout 30s;

        # Limit liczby rownoczesnych polaczen z jednego IP.
        limit_conn conns 20;

        location / {
            root  /usr/share/nginx/html;
            index index.html;
            # Limit tempa zadan: 20 r/s, krotki burst, nadmiar -> 429.
            limit_req zone=perip burst=40 nodelay;
        }

        # stub_status bez limitow, zeby Zabbix mogl zbierac metryki takze
        # w trakcie ataku (monitoring nie moze sam sie zablokowac).
        location /status {
            stub_status;
        }
    }
}
