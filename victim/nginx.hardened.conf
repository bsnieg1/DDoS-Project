# see nginx.conf - hardcoded value instead of "auto", matched to the cgroup limit
worker_processes 2;
events { worker_connections 1024; }

# =====================================================================
#  HARDENED victim configuration variant (hardening).
#  HTTP/2 Rapid Reset mitigation (CVE-2023-44487) via configuration,
#  as defense-in-depth ON TOP OF the built-in nginx patch >= 1.25.3.
#  Used by docker-compose.hardening.yml (replaces nginx.conf).
#  Compare behavior with the vulnerable variant (victim/nginx.conf) on
#  Zabbix charts: under attack, the rate-limit returns 429, and CPU / number
#  of processed requests remain limited.
# =====================================================================

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format labfmt '$remote_addr proto=$server_protocol status=$status '
                      'req="$request" conn_requests=$connection_requests';
    access_log /var/log/nginx/access.log labfmt;

    # --- Rate limiting: limit request rate and connections per IP ---
    # HTTP/2 stream flood from a single source is cut off with a cheap 429,
    # instead of loading the backend with full processing.
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conns:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 443 ssl;
        http2 on;
        server_name victim.lab;

        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;

        # --- Tightened HTTP/2 limits (compared to vulnerable variant) ---
        # Fewer concurrent streams per connection + shorter connections
        # (fewer requests per connection) reduce the Rapid Reset multiplier.
        http2_max_concurrent_streams 32;   # vulnerable: 128
        keepalive_requests 100;            # vulnerable: 1000
        keepalive_timeout 30s;

        # Limit concurrent connections from a single IP.
        limit_conn conns 20;

        location / {
            root  /usr/share/nginx/html;
            index index.html;
            # Request rate limit: 20 r/s, short burst, excess -> 429.
            limit_req zone=perip burst=40 nodelay;
        }

        # stub_status without limits, so Zabbix can collect metrics even
        # during the attack (monitoring must not block itself).
        location /status {
            stub_status;
        }
    }
}
