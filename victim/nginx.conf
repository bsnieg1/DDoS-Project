# "auto" czyta /proc/cpuinfo HOSTA (ignoruje limit cgroup kontenera) - przy
# VIC_CPUS=2.0 na 12-rdzeniowym hoscie dawaloby to 12 workerow walczacych o
# budzet 2 rdzeni (throttling, zaniza i zaszumia pomiar CPU%). Wartosc na
# sztywno, dopasowana do limitu cgroup (docker-compose: VIC_CPUS / cpuset).
worker_processes 2;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log pokazuje wersje protokolu ($server_protocol) i liczbe zadan na
    # polaczenie - przydatne do obserwacji zachowania HTTP/2.
    log_format labfmt '$remote_addr proto=$server_protocol status=$status '
                      'req="$request" conn_requests=$connection_requests';
    access_log /var/log/nginx/access.log labfmt;

    server {
        listen 443 ssl;
        http2 on;
        server_name victim.lab;

        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;

        # --- Limity/mitygacja po stronie HTTP/2 ---
        # http2_max_concurrent_streams ogranicza liczbe rownoczesnych
        # strumieni na polaczenie - to jeden z parametrow istotnych dla
        # CVE-2023-44487 (Rapid Reset). keepalive_requests ogranicza liczbe
        # zadan na jedno polaczenie TCP/TLS.
        http2_max_concurrent_streams 128;
        keepalive_requests 1000;
        keepalive_timeout 60s;

        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        location /status {
            stub_status;
        }
    }
}
