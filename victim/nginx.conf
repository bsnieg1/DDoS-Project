# "auto" reads /proc/cpuinfo of the HOST (ignores cgroup limit of the container) - with
# VIC_CPUS=2.0 on a 12-core host this would give 12 workers fighting for a 2-core
# budget (throttling, skews and adds noise to CPU% measurement). Hardcoded value,
# matched to the cgroup limit (docker-compose: VIC_CPUS / cpuset).
worker_processes 2;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log shows protocol version ($server_protocol) and requests per
    # connection - useful for observing HTTP/2 behavior.
    log_format labfmt '$remote_addr proto=$server_protocol status=$status '
                      'req="$request" conn_requests=$connection_requests';
    access_log /var/log/nginx/access.log labfmt;

    server {
        listen 443 ssl;
        http2 on;
        server_name victim.lab;

        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;

        # --- HTTP/2 limits/mitigation ---
        # http2_max_concurrent_streams limits the number of concurrent
        # streams per connection - one of the key parameters for
        # CVE-2023-44487 (Rapid Reset). keepalive_requests limits the number
        # of requests per TCP/TLS connection.
        http2_max_concurrent_streams 128;
        keepalive_requests 1000;
        keepalive_timeout 60s;

        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        location /status {
            stub_status;
        }
    }
}
