# Konfiguracja zabbix-agent2 dla hosta "victim" w labie HTTP/2.
# Minimalna, labowa — logi na stdout (widoczne w `docker compose logs victim`).

# Serwer Zabbix (passive checks: serwer pyta agenta).
Server=zabbix-server

# Serwer dla aktywnych checkow (agent sam wysyla dane do serwera).
ServerActive=zabbix-server

# Nazwa hosta MUSI zgadzac sie z nazwa hosta utworzonego w Zabbixie.
Hostname=victim

# W kontenerze logujemy na konsole zamiast do pliku.
LogType=console

# Agent nasluchuje domyslnie na 0.0.0.0:10050 — zostawiamy domyslne.
