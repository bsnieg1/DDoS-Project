# Zabbix-agent2 configuration for the "victim" host in the HTTP/2 lab.
# Minimal, lab-only — logs to stdout (visible in `docker compose logs victim`).

# Zabbix server (passive checks: server queries the agent).
Server=zabbix-server

# Server for active checks (agent sends data to the server on its own).
ServerActive=zabbix-server

# Host name MUST match the host name created in Zabbix.
Hostname=victim

# In a container, we log to console instead of a file.
LogType=console

# Agent listens on the default 0.0.0.0:10050 — keeping defaults.
