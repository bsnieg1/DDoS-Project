worker_processes auto;
events { worker_connections 1024; }

# =====================================================================
# WARIANT PODATNY na HTTP/2 Rapid Reset (CVE-2023-44487).
# Uzywany razem z docker-compose.vuln.yml, ktory dodatkowo pina starszy
# obraz nginx (<= 1.25.2, sprzed mitygacji resetow w 1.25.3).
#
# W stosunku do produkcyjnego nginx.conf swiadomie OSLABIAMY obrone:
#   - keepalive_requests podniesione do ~1 mln  -> nginx NIE zamyka
#     polaczenia po 1000 zadaniach, wiec zalew HEADERS+RST_STREAM leci
#     bez przerwy po jednym polaczeniu TCP/TLS (to glowny hamulec nginx);
#   - http2_max_concurrent_streams podniesione   -> wiecej rownoczesnej
#     pracy alokowanej per polaczenie.
#
# NIE uzywac poza labem. To celowo podatna konfiguracja dydaktyczna.
# Porownaj z nginx.hardened.conf (rate-limiting) i nginx.conf (rozsadne limity).
# =====================================================================

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format labfmt '$remote_addr proto=$server_protocol status=$status '
                      'req="$request" conn_requests=$connection_requests';
    access_log /var/log/nginx/access.log labfmt;

    server {
        listen 443 ssl;
        http2 on;
        server_name victim.lab;

        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;

        # --- Obrona CELOWO oslabiona (patrz naglowek) ---
        http2_max_concurrent_streams 1024;   # zmitygowany: 128
        keepalive_requests 1000000;           # zmitygowany: 1000  <- kluczowe
        keepalive_timeout 300s;

        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        location /status {
            stub_status;
        }
    }
}
