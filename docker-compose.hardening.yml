# HARDENED victim mode — hardening against HTTP/2 Rapid Reset.
# Replaces the mounted nginx configuration with the variant that includes rate-limiting
# and tightened HTTP/2 limits (victim/nginx.hardened.conf). Everything else (Zabbix
# agent, network, resource limits) remains unchanged.
#
# Before/after comparison on a single workstation:
#
#   # 1) VULNERABLE mode (base) — launch the attack, see the spike in Zabbix:
#   docker compose \
#     -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.monitoring.yml up -d --build victim
#
#   # 2) HARDENED mode — same attack, rate-limit cuts the flood:
#   docker compose \
#     -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.monitoring.yml -f docker-compose.hardening.yml \
#     up -d victim
#
# After each change, run the same h2load traffic (see README-MONITORING.md,
# "Detection test" section) and compare metrics/alerts.

services:
  victim:
    volumes:
      # Compose merges volumes by target path, so this entry OVERRIDES
      # the nginx.conf mount from the base (same target /etc/nginx/nginx.conf),
      # substituting the hardened variant. Other mounts (certs, html) remain.
      - ./victim/nginx.hardened.conf:/etc/nginx/nginx.conf:ro
