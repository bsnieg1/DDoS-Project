# Tryb UTWARDZONY victima — hardening przeciw HTTP/2 Rapid Reset.
# Podmienia zamontowana konfiguracje nginx na wariant z rate-limitingiem i
# zaostrzonymi limitami HTTP/2 (victim/nginx.hardened.conf). Reszta (agent
# Zabbix, siec, limity zasobow) bez zmian.
#
# Porownanie before/after na jednym stanowisku:
#
#   # 1) Tryb PODATNY (baza) — odpal atak, zobacz skok w Zabbixie:
#   docker compose \
#     -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.monitoring.yml up -d --build victim
#
#   # 2) Tryb UTWARDZONY — ten sam atak, rate-limit tnie flood:
#   docker compose \
#     -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.monitoring.yml -f docker-compose.hardening.yml \
#     up -d victim
#
# Po kazdej zmianie uruchom ten sam ruch h2load (patrz README-MONITORING.md,
# sekcja "Test detekcji") i porownaj metryki/alerty.

services:
  victim:
    volumes:
      # Compose scala wolumeny po sciezce docelowej, wiec ten wpis NADPISUJE
      # montaz nginx.conf z bazy (ta sama docelowa /etc/nginx/nginx.conf),
      # podkladajac wariant utwardzony. Pozostale montaze (certy, html) zostaja.
      - ./victim/nginx.hardened.conf:/etc/nginx/nginx.conf:ro
