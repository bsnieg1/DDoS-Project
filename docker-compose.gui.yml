# GUI panel (localhost:8090) for dynamic bot fleet scaling + live monitoring.
# Controls its OWN pool of bot containers (gui-bot-N) via mounted docker socket.
# Monitoring (CPU/victim connections over time) is viewed in Zabbix.
#
# Requires: built bot image (ddos-lab-botfleet:latest or ddos-lab-bot)
# and a running labnet network with victim "victim". Typical flow:
#
#   # 1. Victim WITH Zabbix agent + monitoring stack (victim now has the agent
#   #    also in the labvic variant - see victim/Dockerfile.labvic):
#   NGINX_OLD=1.25.1-alpine VICTIM_MODE=normal \
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.monitoring.yml -f docker-compose.labvic.yml \
#     up -d --build
#
#   # 2. Zabbix provisioning (host victim + Linux/Nginx templates) - once:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.monitoring.yml run --rm zabbix-provision
#
#   # 3. GUI panel:
#   docker compose -f docker-compose.gui.yml up -d --build
#
#   # Open http://localhost:8090  (slider = number of bots, Fire/Stop),
#   # and alongside http://localhost:8080  (Zabbix, Admin/zabbix) for metrics.
#
# Bots created by the panel are cpuset-pinned to cores 2-11 (victim holds
# 0,1 - see docker-compose.labvic.yml), so the fleet doesn't steal CPU from the victim.

services:
  botgui:
    build: ./gui
    image: ddos-lab-botgui:latest
    container_name: lab-botgui
    environment:
      # Network of the main stack (docker-compose.yml has name: ddos-lab -> ddos-lab_labnet).
      # We do NOT use COMPOSE_PROJECT_NAME: when loading docker-compose.gui.yml
      # its own project name ("ddos") would override the variable and give the wrong network.
      # Explicitly overridable via LABNET in the environment.
      LABNET: "${LABNET:-ddos-lab_labnet}"
      BOT_IMAGE: "${BOT_IMAGE:-ddos-lab-botfleet:latest}"
      VICTIM: "victim:443"
      BOT_CPUSET: "${BOT_CPUSET:-2-11}"
      BOT_CPUS: "${BOT_CPUS:-0.1}"
      VICTIM_CTR: "lab-victim"
      ZABBIX_URL: "${ZABBIX_URL:-http://localhost:8080}"
      PORT: "8090"
      MAX_BOTS: "${MAX_BOTS:-100}"
    volumes:
      # Host daemon socket - the panel manages bot containers.
      # On Docker Desktop (Windows/Mac) this path works the same way.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8090:8090"
    restart: unless-stopped
