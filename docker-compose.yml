name: ddos-lab

# Zredukowane, defensywno-edukacyjne laboratorium:
#   victim  - serwer nginx po HTTP/2 (TLS self-signed)
#   loadgen - h2load do pomiaru baseline normalnego ruchu HTTP/2
#
# Siec labnet ma internal: true -> kontenery nie maja routingu do internetu.
# Weryfikacje wykonujemy z wnetrza (docker compose exec loadgen ...), bo siec
# internal nie publikuje portow na host.

services:
  victim:
    image: nginx:1.27-alpine
    container_name: lab-victim
    restart: unless-stopped
    volumes:
      - ./victim/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./victim/cert.pem:/etc/nginx/cert.pem:ro
      - ./victim/key.pem:/etc/nginx/key.pem:ro
      - ./victim/html:/usr/share/nginx/html:ro
    networks:
      - labnet

  loadgen:
    build: ./loadgen
    container_name: lab-loadgen
    depends_on:
      - victim
    networks:
      - labnet

networks:
  labnet:
    internal: true
