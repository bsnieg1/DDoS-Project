name: ddos-lab

# Reduced, defensive/educational laboratory:
#   victim  - nginx server over HTTP/2 (TLS self-signed)
#   loadgen - h2load for measuring baseline of normal HTTP/2 traffic
#
# The labnet network has internal: true -> containers have no routing to the internet.
# Verification is done from inside (docker compose exec loadgen ...), because the
# internal network does not publish ports to the host.

services:
  victim:
    image: nginx:1.27-alpine
    container_name: lab-victim
    restart: unless-stopped
    volumes:
      - ./victim/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./victim/cert.pem:/etc/nginx/cert.pem:ro
      - ./victim/key.pem:/etc/nginx/key.pem:ro
      - ./victim/html:/usr/share/nginx/html:ro
    networks:
      - labnet

  loadgen:
    build: ./loadgen
    container_name: lab-loadgen
    depends_on:
      - victim
    networks:
      - labnet

networks:
  labnet:
    internal: true
